[project]
name = "ontology-engine"
version = "0.1.0"
description = "A toolchain for knowledge graph based analysis"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "simpleeval>=0.9.13",
    "asteval>=0.9.29",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
kuzu = [
    "kuzu>=0.4.0",
]
chroma = [
    "chromadb>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ontology_engine*"]
