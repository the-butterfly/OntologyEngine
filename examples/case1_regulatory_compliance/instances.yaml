        issued_by: { supplier_id: "SUP_C1" }
        issued_to: { enterprise_id: "CE_WHITELISTED_001" }
        authenticity_verified: true
        authenticity_verify_date: "2026-04-02"
        authenticity_source: "国家税务总局发票查验平台"

  - fact_object: Contract
    data:
      - contract_no: "CTR_C1_001"
        contract_amount: { value: 10000000, currency: CNY }
        start_date: "2026-01-01"
        end_date: "2026-12-31"
        status: ACTIVE
        signed_by: { supplier_id: "SUP_C1" }
        signed_with: { enterprise_id: "CE_WHITELISTED_001" }

