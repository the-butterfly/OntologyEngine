# ============================================================
# OntologyEngine - Circular 23 合规测试实例数据
#
# 包含五个典型测试场景：
#   C1: 完全合规供应商（通过所有Circular 23检查）
#   C2: 核心企业不在白名单（触发RD_CIRCULAR23_core_enterprise_whitelist）
#   C3: 发票真实性核验失败（触发RD_CIRCULAR23_invoice_authenticity）
#   C4: 担保限额超出（触发RD_CIRCULAR23_guarantee_limit）
#   C5: 风险集中度超限（触发RD_CIRCULAR23_risk_concentration）
#
# ============================================================

instances:

  # ============================================================
  # 核心企业数据（三个核心企业）
  # ============================================================
  - fact_object: CoreEnterprise
    data:
      - enterprise_id: "CE_WHITELISTED_001"
        company_name: "华为技术有限公司"
        credit_rating: "AAA"
        annual_procurement_volume: { value: 50000000000, currency: CNY }
        is_in_regulatory_whitelist: true
        whitelist_expiry_date: "2027-12-31"

      - enterprise_id: "CE_WHITELISTED_002"
        company_name: "比亚迪股份有限公司"
        credit_rating: "AA+"
        annual_procurement_volume: { value: 30000000000, currency: CNY }
        is_in_regulatory_whitelist: true
        whitelist_expiry_date: "2027-06-30"

      - enterprise_id: "CE_NOT_IN_WHITELIST"
        company_name: "某地产集团有限公司"
        credit_rating: "BBB"
        annual_procurement_volume: { value: 15000000000, currency: CNY }
        is_in_regulatory_whitelist: false
        whitelist_expiry_date: null

  # ============================================================
