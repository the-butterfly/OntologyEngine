  #   - 发票真实性核验率100% ✓
  #   - 最大单笔担保占比5%（<=10%）✓
  #   - 风险集中度35%（<50%）✓
  # 预期：is_circular23_compliant = true → APPROVE
  # ============================================================
  - fact_object: Supplier
    data:
      - supplier_id: "SUP_C1"
        company_name: "深圳恒通科技有限公司"
        unified_credit_code: "91440300MA5GCASE_C1"
        registered_capital: { value: 50000000, currency: CNY }
        establishment_date: "2018-03-15"
        industry_type: MANUFACTURING
        company_size: MEDIUM
        status: ACTIVE
        address: { province: "广东省", city: "深圳市", district: "南山区" }
        tax_compliance_score: 88
        negative_news_count_90d: 0
        risk_concentration_ratio: 35
        circular23_compliance_status: COMPLIANT

  - fact_object: Invoice
    data:
      - invoice_no: "INV_C1_001"
        invoice_type: SPECIAL
        amount: { value: 3000000, currency: CNY }
        issue_date: "2026-03-15"
        due_date: "2026-06-15"
        status: PAID
        issued_by: { supplier_id: "SUP_C1" }
        issued_to: { enterprise_id: "CE_WHITELISTED_001" }
        authenticity_verified: true
        authenticity_verify_date: "2026-03-16"
        authenticity_source: "国家税务总局发票查验平台"

      - invoice_no: "INV_C1_002"
        invoice_type: SPECIAL
        amount: { value: 2500000, currency: CNY }
        issue_date: "2026-02-28"
        due_date: "2026-05-28"
        status: PAID
        issued_by: { supplier_id: "SUP_C1" }
        issued_to: { enterprise_id: "CE_WHITELISTED_002" }
        authenticity_verified: true
        authenticity_verify_date: "2026-03-01"
        authenticity_source: "国家税务总局发票查验平台"

      - invoice_no: "INV_C1_003"
        invoice_type: SPECIAL
        amount: { value: 1800000, currency: CNY }
        issue_date: "2026-04-01"
        due_date: "2026-07-01"
