# ============================================================
# OntologyEngine 零售经营分析 - 验收实例数据
#
# 包含四个典型验收场景：
#   CASE-EAST:  华东大区门店（毛利率偏低 + 回款慢 + 库存压力）
#   CASE-SOUTH: 华南大区门店（经营稳健，部分门店回款偏慢）
#   CASE-NORTH: 华北大区门店（低毛利 + 高库存 + 高 DSO）
#   CASE-ECOM:  电商渠道门店（高毛利 + 低 DSO + 低 DIO）
#
# 行业基准参考：
#   百货零售毛利率 ~41%（中国百货商业协会 2024）
#   超市毛利率 ~25%
#   电商渠道毛利率 ~49%
#   零售 DSO 行业基准 5-30 天（CreditPulse 2025）
#   零售 DIO 行业基准 30-90 天
#
# 数据为合成数据，结构参考真实零售企业经营分析场景
# ============================================================

