# ============================================================
# 零售经营分析问数 — 验收用例规格
#
# 用途：描述指标卡计算、规则执行和问数联动的预期行为
# 数据来源：instances.yaml
# Schema 来源：schema.yaml
#
# 验收维度：
#   1. L3 指标计算正确性（毛利率 / DSO / DIO）
#   2. L4 规则版本化执行（v1 vs v2 差异化阈值）
#   3. 指标卡版本修订对消费结果的影响
#   4. 问答结果与视图结果的互证
#   5. 证据链四类互索引完整性
# ============================================================

test_suite:
  id: "ops_bi_query_agent_v1"
  name: "零售经营分析问数验收套件"
  schema: "examples/case4_bi_query_agent/schema.yaml"
  instances: "examples/case4_bi_query_agent/instances.yaml"

# ============================================================
# TC-201: 毛利率指标计算（v1.5 口径）
# 目标：验证 (net_revenue - cogs) / net_revenue 计算正确
# ============================================================
test_cases:

  - id: TC-201
    name: "毛利率指标计算（v1.5 口径）"
    entity_id: "SH-014"
    categorization: ops_health_review
    tags: [smoke, metric_card, l3_derived]

    expected_metrics:
      net_revenue_value:
        value: 40375000
        tolerance: 1000
      cogs_value:
        value: 21800000
      gross_margin_rate:
        value: 46.0
        tolerance: 0.5
      budget_variance_margin:
        value: 0.0
        tolerance: 1.0

    expected_output:
      gross_margin_rate_gte: 45.0
      metric_card_version: "v1.5"
      metric_card_formula: "(net_revenue_value - cogs_value) / net_revenue_value"

  # ============================================================
  # TC-202: DSO 指标计算
  # 目标：验证 DSO = (AR / Net Credit Sales) × 90
  # ============================================================
  - id: TC-202
    name: "DSO 指标计算"
    entity_id: "SH-014"
    categorization: cash_collection_monitoring
    tags: [smoke, metric_card, l3_derived]

    expected_metrics:
      total_receivable_value:
        value: 36800000
      net_credit_sales_value:
        value: 40375000
      dso_days:
        value: 82.0
        tolerance: 2.0

    expected_output:
      dso_days_gte: 80
      metric_card_version: "v1.0"

  # ============================================================
  # TC-203: DIO 指标计算
  # 目标：验证 DIO = (Average Inventory / COGS) × 90
  # ============================================================
  - id: TC-203
    name: "DIO 指标计算"
    entity_id: "BJ-002"
    categorization: inventory_efficiency
    tags: [smoke, metric_card, l3_derived]

    expected_metrics:
      average_inventory_value:
        value: 31100000
      cogs_for_inventory_value:
        value: 33720000
      dio_days:
        value: 83.0
        tolerance: 2.0

    expected_output:
      dio_days_gte: 80
      metric_card_version: "v1.0"

  # ============================================================
  # TC-204: 异常门店识别 v1（统一阈值）
  # 目标：SH-014 高毛利 + DSO > 60 → HIGH_MARGIN_SLOW_CASH
  # NJ-007 加盟店 DSO=68 > 60 → v1 判异常
  # ============================================================
  - id: TC-204
    name: "异常门店识别 v1（统一阈值）— SH-014"
    entity_id: "SH-014"
    categorization: ops_health_review
    tags: [smoke, rule_v1, exception_detection]

    expected_metrics:
      gross_margin_rate:
        value: 46.0
        tolerance: 0.5
      dso_days:
        value: 82.0
        tolerance: 2.0

    expected_rule_steps:
      - rule_id: RD201_ops_exception_detection
        logic_id: RL201_exception_v1
        fired: true
        condition_result: true
        output:
          is_exception_store: true
          exception_type: "HIGH_MARGIN_SLOW_CASH"

    expected_output:
      is_exception_store: true
      exception_type: "HIGH_MARGIN_SLOW_CASH"
      rule_version: "v1"

  # ============================================================
  # TC-205: 异常门店识别 v2（差异化阈值）— 加盟店不再误报
  # 目标：NJ-007 加盟店 DSO=68，v1 判异常，v2 不判异常
  # ============================================================
  - id: TC-205
    name: "异常门店识别 v2 — 加盟店 NJ-007 不再误报"
    entity_id: "NJ-007"
    categorization: ops_health_review
    tags: [rule_v2, exception_detection, franchise_threshold]

    expected_metrics:
      gross_margin_rate:
        value: 46.0
        tolerance: 1.0
      dso_days:
        value: 68.0
        tolerance: 2.0

    expected_rule_steps:
      - rule_id: RD201_ops_exception_detection
        logic_id: RL201_exception_v2
        fired: true
        condition_result: false
        output:
          is_exception_store: false
          exception_type: "NONE"

    expected_output:
      is_exception_store: false
      exception_type: "NONE"
      rule_version: "v2"
      v1_would_have_triggered: true
      v2_diff_description: "加盟门店 DSO 阈值从 60 天调整为 75 天，NJ-007 DSO=68 不再触发"

  # ============================================================
  # TC-206: 毛利率指标卡修订 v1.4 → v1.5
  # 目标：验证口径修订后数值变化
  # v1.4: (gross_sales - cogs) / gross_sales
  # v1.5: (net_revenue - cogs) / net_revenue
  # ============================================================
  - id: TC-206
    name: "毛利率指标卡口径修订影响"
    entity_id: "SH-001"
    categorization: ops_health_review
    tags: [metric_card_version, asset_edit, closure_verification]

    expected_metrics:
      gross_margin_rate_v14:
        formula: "(gross_sales_value - cogs_value) / gross_sales_value"
        value: 45.0
        tolerance: 0.5
      gross_margin_rate_v15:
        formula: "(net_revenue_value - cogs_value) / net_revenue_value"
        value: 41.5
        tolerance: 0.5

    expected_output:
      metric_card_version_diff:
        from: "v1.4"
        to: "v1.5"
        formula_change: "分母从 gross_sales 改为 net_revenue"
        value_change: "从 ~45.0% 降至 ~41.5%"
        reason: "扣除退货和折让后，毛利率下降约 3.5 个百分点"
      view_impact:
        view_id: "view.ops_health_q2"
        region_east_margin_change: "从 ~42.5% 降至 ~41.9%"
      question_impact:
        question: "华东大区 Q2 毛利率为什么低于预算？"
        answer_v14: "低于预算约 2.0 个点"
        answer_v15: "低于预算约 2.6 个点"

  # ============================================================
  # TC-207: 区域级经营快照汇总
  # 目标：验证区域级指标汇总与 scenario.md 中的数据切片一致
  # ============================================================
  - id: TC-207
    name: "区域级经营快照汇总"
    entity_id: "AGGREGATE"
    categorization: ops_health_review
    tags: [aggregation, regional_snapshot]

    expected_metrics:
      region_east:
        net_revenue_total: 229235000
        gross_margin_rate: 41.9
        dso_days: 63
        dio_days: 74
        tolerance_margin: 2.0
        tolerance_days: 5

      region_south:
        net_revenue_total: 131765000
        gross_margin_rate: 40.8
        dso_days: 51
        dio_days: 61
        tolerance_margin: 2.0
        tolerance_days: 5

      region_north:
        net_revenue_total: 91491000
        gross_margin_rate: 38.4
        dso_days: 69
        dio_days: 83
        tolerance_margin: 2.0
        tolerance_days: 5

      region_ecom:
        net_revenue_total: 60800000
        gross_margin_rate: 49.0
        dso_days: 18
        dio_days: 37
        tolerance_margin: 2.0
        tolerance_days: 5

  # ============================================================
  # TC-208: 证据链四类互索引完整性
  # 目标：验证从消费结果可以回溯到资产版本和证据来源
  # ============================================================
  - id: TC-208
    name: "证据链四类互索引完整性"
    entity_id: "SH-014"
    categorization: ops_health_review
    tags: [mutual_index, traceability, closure]

    expected_output:
      extracted_from:
        - "MonthlySales.SLS-SH014-2026Q2"
        - "ARAging.AR-SH014-2026Q2"
        - "InventorySnapshot.INV-SH014-2026Q2"
      supported_by:
        - "frag.board_pack_q2_2026.p12"
        - "frag.metric_dictionary.gross_margin"
        - "frag.ar_aging_note.sh014"
      defined_in:
        - "metric.gross_margin_rate@v1.5"
        - "metric.dso_days@v1.0"
        - "metric.dio_days@v1.0"
        - "ops_exception_rules@v2"
      trace_to:
        - "view.ops_health_q2"
        - "report.ops_review_q2"
        - "query_result.q1_east_margin"

  # ============================================================
  # TC-209: 规则版本变化对异常门店清单的影响
  # 目标：v1 → v2 后，加盟门店从异常清单中移除
  # ============================================================
  - id: TC-209
    name: "规则版本变化对异常门店清单的影响"
    entity_id: "BATCH"
    categorization: ops_health_review
    tags: [rule_version_impact, batch_analysis, closure]

    expected_output:
      v1_exception_stores:
        - store_id: "SH-014"
          reason: "高毛利(46%) + DSO=82 > 60"
          type: "HIGH_MARGIN_SLOW_CASH"
        - store_id: "NJ-007"
          reason: "高毛利(46%) + DSO=68 > 60（加盟）"
          type: "HIGH_MARGIN_SLOW_CASH"
        - store_id: "NB-012"
          reason: "高毛利(46%) + DSO=65 > 60（加盟）"
          type: "HIGH_MARGIN_SLOW_CASH"
      v2_exception_stores:
        - store_id: "SH-014"
          reason: "高毛利(46%) + DSO=82 > 60（直营）"
          type: "HIGH_MARGIN_SLOW_CASH"
      v2_removed_from_v1:
        - store_id: "NJ-007"
          reason: "加盟门店 DSO 阈值调整为 75 天，DSO=68 不再触发"
        - store_id: "NB-012"
          reason: "加盟门店 DSO 阈值调整为 75 天，DSO=65 不再触发"
      impact_summary: "v1 有 3 家异常门店（均为高毛利慢回款），v2 减少到 1 家，加盟门店误报减少 2 家"

  # ============================================================
  # TC-210: 电商渠道经营健康度验证
  # 目标：验证电商渠道高毛利、低 DSO、低 DIO 的特征
  # ============================================================
  - id: TC-210
    name: "电商渠道经营健康度验证"
    entity_id: "EC-001"
    categorization: ops_health_review
    tags: [ecom_channel, healthy_store]

    expected_metrics:
      gross_margin_rate:
        value: 49.0
        tolerance: 1.0
      dso_days:
        value: 18.0
        tolerance: 3.0
      dio_days:
        value: 37.0
        tolerance: 3.0

    expected_rule_steps:
      - rule_id: RD201_ops_exception_detection
        logic_id: RL201_exception_v2
        fired: true
        condition_result: false
        output:
          is_exception_store: false
          exception_type: "NONE"

    expected_output:
      is_exception_store: false
      ops_health_grade: "A"
