# ============================================================
# KGML Schema v3.0 - 供应链金融知识图谱 Schema
# 场景：供应商融资授信风险评估
# ============================================================

# ============================================================
# 模块1: metadata - 元信息层
# ============================================================
metadata:
  id: "kg://supply-chain/finance/credit-assessment/1.0"
  name: "供应链金融授信评估知识图谱"
  description: "基于供应商多维数据（交易、税务、物流、舆情）构建的融资授信风险评估体系"
  version: "1.0.0"
  schema_version: "3.0"
  domain: "finance/supply-chain/credit-assessment"
  language: ["zh", "en"]
  license: "Apache-2.0"
  authors:
    - name: "Supply Chain Risk Team"
      contact: "risk@example.com"
  dependencies:
    - id: "kg://common/financial-ontology/1.0"
      type: "import"
  metadata:
    created: "2026-04-07T00:00:00Z"
    modified: "2026-04-07T00:00:00Z"

# ============================================================
# 模块2: types - 类型系统
# ============================================================
types:
  - name: "Money"
    description: "带货币的金额"
    base_type: "object"
    properties:
      value:
        type: "decimal"
        description: "数值"
      currency:
        type: "string"
        default: "CNY"
        description: "货币代码"
    vector_config:
      enabled: true
      model: "text-embedding-3-small"
      dimension: 1536
      fields: ["value", "currency"]

  - name: "Percentage"
    description: "百分比 0-100"
    base_type: "float"
    min: 0.0
    max: 100.0
    unit: "%"

  - name: "RiskScore"
    description: "风险评分 0-100"
    base_type: "integer"
    min: 0
    max: 100

  - name: "CreditGrade"
    description: "信用等级评分"
    base_type: "string"
    enum: ["AAA", "AA", "A", "BBB", "BB", "B", "CCC", "CC", "C", "D"]

  - name: "DateRange"
    description: "日期范围"
    base_type: "object"
    properties:
      start:
        type: "date"
      end:
        type: "date"

  - name: "Address"
    description: "地址信息"
    base_type: "object"
    properties:
      province:
        type: "string"
      city:
        type: "string"
      district:
        type: "string"
      detail:
        type: "string"

# ============================================================
# 模块3: enums - 枚举类型
# ============================================================
enums:
  - name: "SupplierStatus"
    description: "供应商经营状态"
    values:
      - id: "ACTIVE"
        label: "正常经营"
        weight: 1.0
        severity_score: 1
      - id: "SUSPENDED"
        label: "暂停经营"
        weight: 0.5
        severity_score: 3
      - id: "REVOKED"
        label: "吊销/注销"
        weight: 0.0
        severity_score: 5
      - id: "ABNORMAL"
        label: "经营异常"
        weight: 0.3
        severity_score: 4

  - name: "RiskLevel"
    description: "风险等级"
    values:
      - id: "LOW"
        label: "低风险"
        weight: 0.1
        severity_score: 1
        color: "#28a745"
      - id: "MEDIUM"
        label: "中风险"
        weight: 0.5
        severity_score: 3
        color: "#ffc107"
      - id: "HIGH"
        label: "高风险"
        weight: 1.0
        severity_score: 5
        color: "#dc3545"

  - name: "CreditLimitLevel"
    description: "授信额度等级"
    values:
      - id: "UNLIMITED"
        label: "无限制授信"
        description: "信用极好，可全额授信"
      - id: "HIGH"
        label: "高额度授信"
        description: "信用良好，高额度授信"
      - id: "MEDIUM"
        label: "中额度授信"
        description: "信用一般，适度授信"
      - id: "LOW"
        label: "低额度授信"
        description: "信用较差，严控额度"
      - id: "DENIED"
        label: "拒绝授信"
        description: "信用极差，拒绝授信"

  - name: "IndustryType"
    description: "行业类型"
    values:
      - id: "MANUFACTURING"
        label: "制造业"
      - id: "RETAIL"
        label: "零售业"
      - id: "LOGISTICS"
        label: "物流业"
      - id: "TECHNOLOGY"
        label: "科技业"
      - id: "AGRICULTURE"
        label: "农业"
      - id: "OTHER"
        label: "其他"

# ============================================================
# 模块4: concepts - 概念/本体层（核心）
# ============================================================
concepts:
  # ========== 核心实体：供应商 ==========
  - name: "Supplier"
    description: "供应链中的供应商/卖方企业"
    category: "entity"
    
    # 基础属性
    attributes:
      - name: "supplier_id"
        type: "string"
        required: true
        unique: true
        description: "供应商唯一标识"
      
      - name: "company_name"
        type: "string"
        required: true
        description: "企业名称"
        vector_config:
          enabled: true
          weight: 1.0
      
      - name: "unified_credit_code"
        type: "string"
        required: true
        unique: true
        description: "统一社会信用代码"
        validation:
          pattern: "^[A-Z0-9]{18}$"
      
      - name: "registered_capital"
        type: "Money"
        required: true
        description: "注册资本"
      
      - name: "establishment_date"
        type: "date"
        required: true
        description: "成立日期"
      
      - name: "industry_type"
        type: "IndustryType"
        required: true
        description: "所属行业"
      
      - name: "company_size"
        type: "string"
        enum: ["LARGE", "MEDIUM", "SMALL", "MICRO"]
        description: "企业规模"
      
      - name: "address"
        type: "Address"
        description: "注册地址"
      
      - name: "status"
        type: "SupplierStatus"
        required: true
        default: "ACTIVE"
        description: "经营状态"
      
      - name: "contact_phone"
        type: "string"
        description: "联系电话"
      
      - name: "contact_email"
        type: "string"
        description: "联系邮箱"

    # 关系定义
    relations:
      - name: "supplies_to"
        target: "CoreEnterprise"
        cardinality: "0..*"
        description: "为核心企业供货"
      
      - name: "has_invoice"
        target: "Invoice"
        cardinality: "0..*"
        description: "持有的发票"
      
      - name: "has_contract"
        target: "Contract"
        cardinality: "0..*"
        description: "持有的合同"
      
      - name: "has_logistics_record"
        target: "LogisticsRecord"
        cardinality: "0..*"
        description: "物流记录"
      
      - name: "guarantees_for"
        target: "Supplier"
        cardinality: "0..*"
        description: "为其他供应商担保"
      
      - name: "guaranteed_by"
        target: "Supplier"
        cardinality: "0..*"
        inverse: "guarantees_for"
        description: "被其他供应商担保"

    # 维度特定属性集合（核心设计）
    dimension_attributes:
      # ===== 融资授信评估维度 =====
      credit_assessment:
        - name: "credit_limit_recommendation"
          type: "Money"
          description: "推荐授信额度"
          derived: true
          calculation:
            type: "formula"
            expression: |
              base = registered_capital.value * 0.5
              multiplier = CASE credit_grade
                WHEN 'AAA' THEN 2.0
                WHEN 'AA' THEN 1.8
                WHEN 'A' THEN 1.5
                WHEN 'BBB' THEN 1.2
                WHEN 'BB' THEN 1.0
                WHEN 'B' THEN 0.8
                ELSE 0.5
              END
              return base * multiplier
        
        - name: "financing_eligibility"
          type: "boolean"
          description: "是否具备融资资格"
          derived: true
          calculation:
            type: "formula"
            expression: |
              return status == 'ACTIVE' 
                AND credit_score >= 60 
                AND overdue_invoice_ratio < 0.1
                AND negative_news_count_90d < 3
        
        - name: "interest_rate_suggestion"
          type: "Percentage"
          description: "建议利率"
          derived: true
          calculation:
            type: "formula"
            expression: |
              base_rate = 0.05  # 5% 基准利率
              risk_premium = (100 - credit_score) / 100 * 0.05
              return (base_rate + risk_premium) * 100
      
      # ===== 交易监控维度 =====
      transaction_monitoring:
        - name: "transaction_volatility_30d"
          type: "float"
          description: "30天交易波动率"
          derived: true
          calculation:
            type: "graph"
            language: "cypher"
            query: |
              MATCH (s:Supplier {supplier_id: $supplier_id})-[:supplies_to]->(ce:CoreEnterprise)
              OPTIONAL MATCH (s)-[:has_invoice]->(i:Invoice)
              WHERE i.issue_date >= date_sub(today(), 30)
              WITH s, collect(i.amount.value) as amounts
              RETURN CASE WHEN size(amounts) > 1 
                THEN stdev(amounts) / avg(amounts) 
                ELSE 0 END AS volatility
        
        - name: "buyer_concentration_ratio"
          type: "Percentage"
          description: "买家集中度（最大单一买家占比）"
          derived: true
          calculation:
            type: "graph"
            language: "cypher"
            query: |
              MATCH (s:Supplier {supplier_id: $supplier_id})-[:supplies_to]->(ce:CoreEnterprise)
              OPTIONAL MATCH (s)-[:has_invoice]->(i:Invoice)-[:issued_to]->(ce)
              WHERE i.issue_date >= date_sub(today(), 90)
              WITH s, ce, sum(i.amount.value) as buyer_amount
              WITH s, max(buyer_amount) as max_amount, sum(buyer_amount) as total
              RETURN CASE WHEN total > 0 
                THEN max_amount / total * 100 
                ELSE 0 END AS concentration

  # ========== 核心企业 ==========
  - name: "CoreEnterprise"
    description: "供应链中的核心企业/买方"
    category: "entity"
    attributes:
      - name: "enterprise_id"
        type: "string"
        required: true
        unique: true
      
      - name: "company_name"
        type: "string"
        required: true
      
      - name: "credit_rating"
        type: "string"
        description: "主体信用评级"
      
      - name: "annual_procurement_volume"
        type: "Money"
        description: "年采购额"
    
    relations:
      - name: "procures_from"
        target: "Supplier"
        cardinality: "0..*"
        inverse: "supplies_to"
        description: "从供应商采购"

  # ========== 发票 ==========
  - name: "Invoice"
    description: "增值税发票"
    category: "entity"
    attributes:
      - name: "invoice_no"
        type: "string"
        required: true
        unique: true
        description: "发票号码"
      
      - name: "invoice_type"
        type: "string"
        enum: ["SPECIAL", "NORMAL", "ELECTRONIC"]
        description: "发票类型"
      
      - name: "amount"
        type: "Money"
        required: true
        description: "发票金额"
      
      - name: "issue_date"
        type: "date"
        required: true
        description: "开票日期"
      
      - name: "due_date"
        type: "date"
        description: "到期日"
      
      - name: "status"
        type: "string"
        enum: ["PENDING", "PAID", "OVERDUE", "CANCELLED"]
        default: "PENDING"
        description: "发票状态"
      
      - name: "is_overdue"
        type: "boolean"
        description: "是否逾期"
        derived: true
        calculation:
          type: "formula"
          expression: "status == 'OVERDUE' OR (due_date IS NOT NULL AND due_date < today())"
    
    relations:
      - name: "issued_by"
        target: "Supplier"
        cardinality: "1"
        inverse: "has_invoice"
      
      - name: "issued_to"
        target: "CoreEnterprise"
        cardinality: "1"
        description: "发票开给"

  # ========== 合同 ==========
  - name: "Contract"
    description: "采购合同"
    category: "entity"
    attributes:
      - name: "contract_no"
        type: "string"
        required: true
        unique: true
      
      - name: "contract_amount"
        type: "Money"
        required: true
        description: "合同金额"
      
      - name: "start_date"
        type: "date"
        required: true
      
      - name: "end_date"
        type: "date"
        required: true
      
      - name: "status"
        type: "string"
        enum: ["DRAFT", "ACTIVE", "COMPLETED", "TERMINATED"]
        default: "ACTIVE"
    
    relations:
      - name: "signed_by"
        target: "Supplier"
        cardinality: "1"
        inverse: "has_contract"
      
      - name: "signed_with"
        target: "CoreEnterprise"
        cardinality: "1"

  # ========== 物流记录 ==========
  - name: "LogisticsRecord"
    description: "物流运输记录"
    category: "entity"
    attributes:
      - name: "tracking_no"
        type: "string"
        required: true
        unique: true
      
      - name: "goods_value"
        type: "Money"
        description: "货值"
      
      - name: "ship_date"
        type: "date"
      
      - name: "receive_date"
        type: "date"
      
      - name: "status"
        type: "string"
        enum: ["SHIPPED", "IN_TRANSIT", "DELIVERED", "RETURNED"]
    
    relations:
      - name: "delivered_by"
        target: "Supplier"
        cardinality: "1"
        inverse: "has_logistics_record"

  # ========== 担保关系 ==========
  - name: "GuaranteeRelation"
    description: "供应商之间的担保关系"
    category: "relation"
    attributes:
      - name: "guarantee_amount"
        type: "Money"
        required: true
        description: "担保金额"
      
      - name: "guarantee_type"
        type: "string"
        enum: ["JOINT_LIABILITY", "MORTGAGE", "PLEDGE"]
        description: "担保类型"
      
      - name: "start_date"
        type: "date"
        required: true
      
      - name: "end_date"
        type: "date"
      
      - name: "status"
        type: "string"
        enum: ["ACTIVE", "EXPIRED", "RELEASED"]
        default: "ACTIVE"

# ============================================================
# 模块5: metrics - 指标层
# ============================================================
metrics:
  # ========== 原子指标（直接输入）==========
  - name: "total_invoice_amount_90d"
    description: "近90天发票总金额"
    type: "Money"
    scope: "Supplier"
    metric_type: "atomic"
    data_source:
      type: "graph"
      query: |
        MATCH (s:Supplier {supplier_id: $supplier_id})-[:has_invoice]->(i:Invoice)
        WHERE i.issue_date >= date_sub(today(), 90)
        RETURN sum(i.amount.value) AS total

  - name: "invoice_count_90d"
    description: "近90天发票数量"
    type: "integer"
    scope: "Supplier"
    metric_type: "atomic"

  - name: "overdue_invoice_amount"
    description: "逾期发票金额"
    type: "Money"
    scope: "Supplier"
    metric_type: "atomic"

  - name: "total_contract_amount"
    description: "合同总金额"
    type: "Money"
    scope: "Supplier"
    metric_type: "atomic"

  - name: "avg_monthly_tax_revenue"
    description: "月均纳税额"
    type: "Money"
    scope: "Supplier"
    metric_type: "atomic"

  - name: "tax_compliance_score"
    description: "税务合规评分"
    type: "RiskScore"
    scope: "Supplier"
    metric_type: "atomic"

  - name: "negative_news_count_90d"
    description: "近90天负面新闻数量"
    type: "integer"
    scope: "Supplier"
    metric_type: "atomic"
    default: 0

  - name: "core_enterprise_count"
    description: "合作核心企业数量"
    type: "integer"
    scope: "Supplier"
    metric_type: "atomic"

  # ========== 派生指标（规则计算）==========
  - name: "overdue_invoice_ratio"
    description: "逾期发票占比"
    type: "Percentage"
    scope: "Supplier"
    metric_type: "derived"
    formula: "overdue_invoice_amount.value / total_invoice_amount_90d.value * 100"
    dependencies:
      - "overdue_invoice_amount"
      - "total_invoice_amount_90d"
    risk_threshold:
      warning: 5.0
      critical: 15.0

  - name: "avg_invoice_amount"
    description: "平均发票金额"
    type: "Money"
    scope: "Supplier"
    metric_type: "derived"
    formula: "total_invoice_amount_90d.value / invoice_count_90d"
    dependencies:
      - "total_invoice_amount_90d"
      - "invoice_count_90d"

  - name: "contract_utilization_rate"
    description: "合同执行率"
    type: "Percentage"
    scope: "Supplier"
    metric_type: "derived"
    formula: "total_invoice_amount_90d.value / total_contract_amount.value * 100"
    dependencies:
      - "total_invoice_amount_90d"
      - "total_contract_amount"

  - name: "business_stability_score"
    description: "业务稳定性评分"
    type: "RiskScore"
    scope: "Supplier"
    metric_type: "derived"
    formula: |
      # 基于合同执行率、交易连续性、买家稳定性的综合评分
      score = 50
      if contract_utilization_rate >= 80: score += 20
      elif contract_utilization_rate >= 50: score += 10
      
      if core_enterprise_count >= 3: score += 15
      elif core_enterprise_count >= 1: score += 5
      
      if overdue_invoice_ratio < 5: score += 15
      elif overdue_invoice_ratio < 10: score += 5
      
      return min(score, 100)
    dependencies:
      - "contract_utilization_rate"
      - "core_enterprise_count"
      - "overdue_invoice_ratio"

  # ========== 图算法指标 ==========
  - name: "guarantee_chain_depth"
    description: "担保链深度"
    type: "integer"
    scope: "Supplier"
    metric_type: "graph"
    algorithm: "longest_path"
    graph_query: |
      MATCH path = (s:Supplier {supplier_id: $supplier_id})-[:guarantees_for|guaranteed_by*1..10]-(other:Supplier)
      RETURN MAX(LENGTH(path)) AS max_depth
    timeout: 30000

  - name: "network_centrality_score"
    description: "网络中心性得分"
    type: "float"
    scope: "Supplier"
    metric_type: "graph"
    algorithm: "page_rank"
    parameters:
      dampingFactor: 0.85
      maxIterations: 100

  # ========== 复合指标（多维度聚合）==========
  - name: "credit_score"
    description: "综合信用评分"
    type: "RiskScore"
    scope: "Supplier"
    metric_type: "composite"
    components:
      - metric: "business_stability_score"
        weight: 0.30
        transform: "value / 100"
      
      - metric: "tax_compliance_score"
        weight: 0.25
        transform: "value / 100"
      
      - metric: "network_centrality_score"
        weight: 0.15
        transform: "min(value * 100, 100) / 100"
      
      - metric: "reputation_score"
        weight: 0.15
        transform: "value / 100"
      
      - metric: "guarantee_risk_adjustment"
        weight: 0.15
        transform: "max(0, 1 - guarantee_chain_depth / 10)"
    
    formula: "SUM(component_score * weight) * 100"
    output_range: [0, 100]
    dependencies:
      - "business_stability_score"
      - "tax_compliance_score"
      - "network_centrality_score"
      - "reputation_score"
      - "guarantee_chain_depth"

  - name: "reputation_score"
    description: "声誉风险评分"
    type: "RiskScore"
    scope: "Supplier"
    metric_type: "composite"
    formula: |
      base_score = 100
      # 负面新闻扣分
      news_deduction = negative_news_count_90d * 10
      # 逾期记录扣分
      overdue_deduction = overdue_invoice_ratio * 2
      return max(0, base_score - news_deduction - overdue_deduction)
    dependencies:
      - "negative_news_count_90d"
      - "overdue_invoice_ratio"

  - name: "guarantee_risk_score"
    description: "担保风险评分"
    type: "RiskScore"
    scope: "Supplier"
    metric_type: "composite"
    formula: |
      if guarantee_chain_depth >= 5: return 20
      elif guarantee_chain_depth >= 3: return 40
      elif guarantee_chain_depth >= 1: return 70
      else: return 100
    dependencies:
      - "guarantee_chain_depth"

  # ========== 维度特定指标 ==========
  - name: "credit_grade"
    description: "信用等级"
    type: "CreditGrade"
    scope: "Supplier"
    metric_type: "derived"
    scope_dimensions:
      - "credit_assessment"
    formula: |
      if credit_score >= 90: return "AAA"
      elif credit_score >= 85: return "AA"
      elif credit_score >= 80: return "A"
      elif credit_score >= 70: return "BBB"
      elif credit_score >= 60: return "BB"
      elif credit_score >= 50: return "B"
      elif credit_score >= 40: return "CCC"
      elif credit_score >= 30: return "CC"
      elif credit_score >= 20: return "C"
      else: return "D"
    dependencies:
      - "credit_score"

# ============================================================
# 模块6: rules - 规则推理层
# ============================================================
rules:
  # ========== 维度定义 ==========
  rule_dimensions:
    dimensions:
      - name: "credit_assessment"
        description: "融资授信评估维度"
        applicable_entities: ["Supplier"]
        triggers:
          - event: "financing_application_submitted"
            entity: "Supplier"
          - event: "credit_review_scheduled"
            entity: "Supplier"
      
      - name: "transaction_monitoring"
        description: "交易监控维度"
        applicable_entities: ["Supplier", "Invoice", "Transaction"]
        triggers:
          - event: "large_transaction_detected"
            entity: "Invoice"
          - event: "daily_batch_check"
            entity: "Supplier"
      
      - name: "risk_early_warning"
        description: "风险预警维度"
        applicable_entities: ["Supplier", "Invoice", "Contract"]
        triggers:
          - event: "overdue_invoice_detected"
            entity: "Invoice"
          - event: "negative_news_detected"
            entity: "Supplier"

  # ========== 规则集 ==========
  ruleset:
    # ---- 规则1: 基础准入检查 ----
    - id: "R001_basic_eligibility"
      name: "基础准入检查"
      description: "供应商融资基础资质检查"
      type: "constraint"
      priority: 100
      enabled: true
      scope:
        dimensions: ["credit_assessment"]
        entity_types: ["Supplier"]
      
      when:
        allOf:
          - expression: "status == 'ACTIVE'"
          - expression: "registered_capital.value >= 1000000"  # 注册资本>=100万
          - expression: "days_between(today(), establishment_date) >= 365"  # 成立>=1年
          - expression: "total_invoice_amount_90d.value >= 500000"  # 近90天交易额>=50万
      
      then:
        action: "approve_eligibility"
        output:
          eligible: true
          next_step: "credit_scoring"
      
      else:
        action: "reject_eligibility"
        output:
          eligible: false
          rejection_reason: "不符合基础准入条件"

    # ---- 规则2: 信用评分计算 ----
    - id: "R002_credit_score_calculation"
      name: "信用评分计算"
      description: "根据多维度指标计算综合信用评分"
      type: "inference"
      priority: 90
      enabled: true
      scope:
        dimensions: ["credit_assessment"]
        entity_types: ["Supplier"]
      
      when:
        expression: "eligible == true"
      
      then:
        action: "calculate_credit_score"
        computation:
          metric: "credit_score"
        output:
          credit_score: "${credit_score}"
          credit_grade: "${credit_grade}"

    # ---- 规则3: 担保圈检测 ----
    - id: "R003_guarantee_circle_detection"
      name: "担保圈风险检测"
      description: "检测是否存在担保圈（循环担保）风险"
      type: "alert"
      priority: 95
      enabled: true
      scope:
        dimensions: ["credit_assessment", "risk_early_warning"]
        entity_types: ["Supplier"]
      
      when:
        graph_query: |
          MATCH cycle = (s:Supplier {supplier_id: $supplier_id})-[:guarantees_for|guaranteed_by*3..10]-(s)
          RETURN count(cycle) > 0 AS has_cycle
      
      then:
        action: "trigger_alert"
        output:
          alert_level: "critical"
          alert_type: "guarantee_circle_detected"
          message: "检测到担保圈风险"
          recommended_action: "降低授信额度或要求追加担保"

    # ---- 规则4: 授信额度计算 ----
    - id: "R004_credit_limit_calculation"
      name: "授信额度计算"
      description: "根据信用评分计算推荐授信额度"
      type: "inference"
      priority: 80
      enabled: true
      scope:
        dimensions: ["credit_assessment"]
        entity_types: ["Supplier"]
      
      when:
        expression: "credit_score IS NOT NULL"
      
      then:
        action: "calculate_credit_limit"
        computation:
          formula: |
            base = registered_capital.value * 0.5
            multiplier = CASE credit_grade
              WHEN 'AAA' THEN 2.0
              WHEN 'AA' THEN 1.8
              WHEN 'A' THEN 1.5
              WHEN 'BBB' THEN 1.2
              WHEN 'BB' THEN 1.0
              WHEN 'B' THEN 0.8
              ELSE 0.5
            END
            # 担保圈风险调整
            if guarantee_chain_depth > 0:
              multiplier = multiplier * (1 - guarantee_chain_depth * 0.1)
            return base * multiplier
        output:
          recommended_credit_limit: "${credit_limit}"
          credit_limit_level: "${level}"

    # ---- 规则5: 风险预警 ----
    - id: "R005_risk_early_warning"
      name: "风险预警触发"
      description: "根据指标阈值触发风险预警"
      type: "alert"
      priority: 70
      enabled: true
      scope:
        dimensions: ["risk_early_warning"]
        entity_types: ["Supplier"]
      
      when:
        anyOf:
          - expression: "overdue_invoice_ratio >= 15"
          - expression: "negative_news_count_90d >= 3"
          - expression: "credit_score < 50"
          - expression: "guarantee_chain_depth >= 5"
      
      then:
        action: "trigger_alert"
        switch:
          - condition: "overdue_invoice_ratio >= 15"
            output:
              alert_level: "critical"
              alert_message: "逾期发票占比过高"
              recommended_action: "暂停新增授信，催收逾期款项"
          
          - condition: "credit_score < 50"
            output:
              alert_level: "critical"
              alert_message: "信用评分严重不足"
              recommended_action: "拒绝授信或要求全额担保"
          
          - condition: "guarantee_chain_depth >= 5"
            output:
              alert_level: "high"
              alert_message: "担保链过长"
              recommended_action: "降低授信额度"
          
          - condition: "negative_news_count_90d >= 3"
            output:
              alert_level: "warning"
              alert_message: "近期负面舆情较多"
              recommended_action: "关注舆情动态，加强监控"

    # ---- 规则6: 利率定价 ----
    - id: "R006_interest_rate_pricing"
      name: "利率定价"
      description: "根据风险等级确定融资利率"
      type: "inference"
      priority: 60
      enabled: true
      scope:
        dimensions: ["credit_assessment"]
        entity_types: ["Supplier"]
      
      when:
        expression: "credit_grade IS NOT NULL"
      
      then:
        action: "determine_interest_rate"
        computation:
          formula: |
            base_rate = 0.05  # 5%基准利率
            risk_premium = (100 - credit_score) / 100 * 0.05
            return (base_rate + risk_premium) * 100
        output:
          recommended_interest_rate: "${interest_rate}%"
          rate_type: "浮动利率"

    # ---- 规则7: 综合授信决策 ----
    - id: "R007_comprehensive_credit_decision"
      name: "综合授信决策"
      description: "综合所有因素生成最终授信决策"
      type: "decision"
      priority: 50
      enabled: true
      scope:
        dimensions: ["credit_assessment"]
        entity_types: ["Supplier"]
      
      when:
        expression: "true"
      
      then:
        action: "generate_decision"
        computation:
          rule_chain:
            - condition: "credit_score >= 80 AND guarantee_chain_depth < 2"
              decision: "APPROVE"
              limit_multiplier: 1.5
              requires_guarantee: false
            
            - condition: "credit_score >= 60 AND guarantee_chain_depth < 3"
              decision: "APPROVE_WITH_CONDITIONS"
              limit_multiplier: 1.0
              requires_guarantee: true
            
            - condition: "credit_score >= 40"
              decision: "APPROVE_RESTRICTED"
              limit_multiplier: 0.5
              requires_guarantee: true
            
            - condition: "true"
              decision: "REJECT"
              reason: "信用评分过低"
        
        output:
          final_decision: "${decision}"
          approved_credit_limit: "${approved_limit}"
          requires_additional_guarantee: "${requires_guarantee}"
          decision_reasoning: "${reasoning}"

# ============================================================
# 模块7: data_sources - 数据源映射层
# ============================================================
data_sources:
  - name: "erp_system"
    type: "postgresql"
    connection: "${ERP_DB_CONNECTION}"
    description: "核心ERP系统"
    
    tables:
      - source_table: "suppliers"
        target_concept: "Supplier"
        mapping:
          supplier_code: "supplier_id"
          company_full_name: "company_name"
          credit_code: "unified_credit_code"
          reg_capital: "registered_capital.value"
          established_date: "establishment_date"
          industry_category: "industry_type"
          company_scale: "company_size"
          business_status: "status"
      
      - source_table: "invoices"
        target_concept: "Invoice"
        mapping:
          invoice_number: "invoice_no"
          invoice_category: "invoice_type"
          total_amount: "amount.value"
          billing_date: "issue_date"
          payment_due_date: "due_date"
          invoice_status: "status"
    
    relations:
      - source_join:
          table: "invoices"
          field: "supplier_code"
        target:
          concept: "Supplier"
          field: "supplier_id"
        relation: "has_invoice"

  - name: "tax_system_api"
    type: "rest_api"
    endpoint: "https://api.tax.gov.cn/v2"
    auth:
      type: "bearer_token"
      token: "${TAX_API_TOKEN}"
    description: "税务系统API"

  - name: "news_monitoring"
    type: "rest_api"
    endpoint: "https://api.news-monitor.com/v1"
    auth:
      type: "api_key"
      key: "${NEWS_API_KEY}"
    description: "舆情监控系统"

# ============================================================
# 模块8: vector_config - 向量检索配置
# ============================================================
vector_config:
  global:
    index_type: "HNSW"
    distance_metric: "cosine"
    dimension: 1536
    model: "text-embedding-3-small"
  
  indexes:
    - name: "supplier_semantic_search"
      type: "HNSW"
      metric: "cosine"
      fields:
        - "Supplier.company_name"
        - "Supplier.address.detail"
      concepts: ["Supplier"]
    
    - name: "risk_similarity"
      type: "IVF_FLAT"
      metric: "l2"
      fields:
        - "Supplier.credit_score"
        - "Supplier.overdue_invoice_ratio"
      concepts: ["Supplier"]

# ============================================================
# 模块9: llm_config - 大模型配置层
# ============================================================
llm_config:
  providers:
    - name: "openai"
      type: "openai"
      model: "gpt-4o"
      api_key: "${OPENAI_API_KEY}"
      default: true
      config:
        temperature: 0.3
        max_tokens: 2000
  
  prompt_templates:
    credit_assessment_explanation: |
      请基于以下供应商数据，生成授信评估解释：
      
      供应商名称: {company_name}
      信用评分: {credit_score}
      信用等级: {credit_grade}
      注册资本: {registered_capital}
      成立时间: {establishment_date}
      
      业务指标:
      - 近90天交易额: {total_invoice_amount_90d}
      - 合同执行率: {contract_utilization_rate}%
      - 逾期发票占比: {overdue_invoice_ratio}%
      
      风险评估:
      - 担保链深度: {guarantee_chain_depth}
      - 负面新闻数: {negative_news_count_90d}
      
      请用简洁专业的语言解释该供应商的信用状况和授信建议。
    
    risk_alert_analysis: |
      分析供应商 {company_name} 的风险预警：
      预警类型: {alert_type}
      预警级别: {alert_level}
      
      请给出风险成因分析和应对建议。
