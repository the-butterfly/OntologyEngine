<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraphRAG Demo — 检索分析报告</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0b1120;color:#e2e8f0;padding:32px 48px}
h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
h2{font-size:20px;font-weight:600;color:#f1f5f9;margin:32px 0 16px;padding-bottom:8px;border-bottom:1px solid #1e293b}
h3{font-size:15px;font-weight:600;color:#e2e8f0;margin:20px 0 10px}
.subtitle{font-size:13px;color:#64748b;margin-bottom:24px}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
.stat-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:700;color:#60a5fa}
.stat-card .label{font-size:11px;color:#64748b;margin-top:4px;text-transform:uppercase}

/* Query card */
.query-card{background:#1e293b;border:1px solid #334155;border-radius:10px;margin-bottom:20px;overflow:hidden}
.query-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid #334155}
.query-header:hover{background:#1e3a5f}
.query-header .q-title{font-size:15px;font-weight:600}
.query-header .q-meta{font-size:11px;color:#64748b}
.query-header .q-meta span{margin-right:12px}
.q-badge-V{color:#3b82f6}
.q-badge-G{color:#10b981}
.q-badge-P{color:#8b5cf6}
.query-body{padding:14px 18px;display:none}
.query-body.open{display:block}

/* Result rows */
.result-table{width:100%;border-collapse:collapse;font-size:13px}
.result-table th{text-align:left;padding:6px 8px;color:#64748b;font-weight:500;font-size:11px;text-transform:uppercase;border-bottom:1px solid #334155}
.result-table td{padding:6px 8px;border-bottom:1px solid #1e293b;vertical-align:top}
.result-table tr:hover{background:#0f172a}
.score-bar{height:6px;border-radius:3px;background:#334155;overflow:hidden;min-width:60px}
.score-fill{height:100%;border-radius:3px;transition:width .5s}
.split-VG{background:linear-gradient(90deg,#3b82f6,#10b981)}
.split-VP{background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.split-V{background:#3b82f6}
.split-G{background:#10b981}
.split-P{background:#8b5cf6}
.split-VGP{background:linear-gradient(90deg,#3b82f6,#10b981,#8b5cf6)}
.source-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin:1px;font-weight:500}
.tag-V{background:rgba(59,130,246,.2);color:#93c5fd}
.tag-G{background:rgba(16,185,129,.2);color:#6ee7b7}
.tag-P{background:rgba(139,92,246,.2);color:#c4b5fd}
.entity-tag{display:inline-block;font-size:10px;background:rgba(30,41,59,.8);color:#94a3b8;padding:1px 5px;border-radius:3px;margin:1px}
.text-preview{font-size:12px;color:#94a3b8;line-height:1.5;max-width:350px}

/* Architecture diagram */
.arch-section{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:20px;margin-bottom:24px}
.arch-flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:16px 0}
.arch-node{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 16px;text-align:center;min-width:80px}
.arch-node .an-title{font-size:11px;font-weight:600;color:#e2e8f0}
.arch-node .an-sub{font-size:10px;color:#64748b;margin-top:2px}
.arch-arrow{color:#475569;font-size:18px}
.arch-node.highlight-V{border-color:#3b82f6}
.arch-node.highlight-G{border-color:#10b981}
.arch-node.highlight-P{border-color:#8b5cf6}

/* LLM answer */
.llm-box{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:14px;margin-top:10px}
.llm-box .llm-label{font-size:10px;color:#60a5fa;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.llm-box .llm-text{font-size:13px;line-height:1.8;color:#e2e8f0;white-space:pre-wrap}

/* Evidence chain */
.evidence-chain{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.evidence-node{background:#0f172a;border:1px solid #1e293b;border-radius:6px;padding:8px 12px;font-size:11px;max-width:200px}
.evidence-node .en-domain{color:#60a5fa;font-weight:500}
.evidence-node .en-text{color:#64748b;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.evidence-node .en-src{color:#10b981;font-size:10px;margin-top:2px}

/* Insights */
.insight-box{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:12px 16px;margin:8px 0;font-size:13px;line-height:1.7}
.insight-box.highlight-green{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2)}
.insight-box.highlight-purple{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.2)}

/* Fusion table */
.fusion-demo{display:flex;gap:20px;margin:16px 0;flex-wrap:wrap}
.fusion-col{flex:1;min-width:200px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px}
.fusion-col h4{font-size:11px;text-transform:uppercase;margin-bottom:8px}
.fusion-col .f-item{font-size:11px;padding:4px 0;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between}
.fusion-col .f-item:last-child{border-bottom:none}
.fusion-col .f-rank{color:#64748b}
</style>
</head>
<body>

<h1>GraphRAG Hybrid Retrieval — 检索分析报告</h1>
<div class="subtitle">基于 OntologyEngine × rag-skill 知识库 • 6 组查询 • 三通道混合检索分析</div>

<div class="stats-grid" id="stats-grid"></div>

<script>
function init() {
  let allData = TEST_DATA;
  if (!allData || !allData.queries) {
    document.body.innerHTML += '<p style="color:#ef4444">Test data not found.</p>';
    return;
  }
  
  renderStats(allData.meta);
  renderArchitecture();
  renderFusionExplain();
  
  const queries = allData.queries;
  const container = document.getElementById('queries-container');
  
  let qidx = 0;
  for (const [qText, qData] of Object.entries(queries)) {
    qidx++;
    const isLLM = allData.llm && allData.llm[qText];
    container.innerHTML += buildQueryCard(qidx, qText, qData, isLLM ? allData.llm[qText] : null);
  }
  
  renderInsights(queries);
}

function renderStats(meta) {
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="num">${meta.total_chunks}</div><div class="label">Chunks</div></div>
    <div class="stat-card"><div class="num">${meta.total_nodes}</div><div class="label">Graph Nodes</div></div>
    <div class="stat-card"><div class="num">${meta.total_embeddings}</div><div class="label">Embeddings</div></div>
    <div class="stat-card"><div class="num">${meta.embedding_dim}d</div><div class="label">Vector Dim</div></div>
  `;
}

function renderArchitecture() {
  document.getElementById('arch-container').innerHTML = `
    <div class="arch-flow">
      <div class="arch-node"><div class="an-title">🔍 Query</div><div class="an-sub">用户问题</div></div>
      <div class="arch-arrow">→</div>
      <div class="arch-node highlight-V"><div class="an-title">🧠 Vector</div><div class="an-sub">语义相似度 top-8</div></div>
      <div class="arch-arrow">→</div>
      <div class="arch-node highlight-G"><div class="an-title">🔗 Graph</div><div class="an-sub">实体共现 top-6</div></div>
      <div class="arch-arrow">→</div>
      <div class="arch-node highlight-P"><div class="an-title">🛤️ Path</div><div class="an-sub">实体链 2-hop BFS</div></div>
      <div class="arch-arrow">→</div>
      <div class="arch-node"><div class="an-title">⚖️ RRF Fusion</div><div class="an-sub">归一化融合排序</div></div>
      <div class="arch-arrow">→</div>
      <div class="arch-node"><div class="an-title">📋 Evidence</div><div class="an-sub">带来源标注</div></div>
    </div>
  `;
}

function renderFusionExplain() {
  document.getElementById('fusion-container').innerHTML = `
    <div style="font-size:13px;line-height:1.7;margin-bottom:12px">
      <b>RRF (Reciprocal Rank Fusion)</b> 融合公式：
      <code style="background:#0f172a;padding:2px 6px;border-radius:4px;color:#60a5fa">
        score(c) = Σ 1/(k + rank_i(c))
      </code>
      其中 k=60, rank_i 是通道 i 中的排序位置。
    </div>
    <div style="font-size:12px;color:#94a3b8;line-height:1.7">
      • 如果一个 chunk 在 <span class="source-tag tag-V">Vector</span> 排第 1, 贡献 1/61 ≈ 0.0164<br>
      • 同时在 <span class="source-tag tag-G">Graph</span> 排第 1, 再贡献 0.0164 → <b>总分 0.0328</b><br>
      • 三通道都出现的 chunk 获得最高分 → 多通道确认 ⇒ 高置信度
    </div>
  `;
}

function buildQueryCard(idx, qText, qData, llmData) {
  let entriesHtml = '';
  const maxScore = Math.max(...qData.entries.map(e => e.score), 0.001);
  
  for (const e of qData.entries) {
    const pct = (e.score / maxScore * 100).toFixed(0);
    const srcStr = e.sources.join('+');
    let cls = 'split-V';
    if (e.sources.length === 2) cls = srcStr.includes('G') ? 'split-VG' : 'split-VP';
    else if (e.sources.length === 3) cls = 'split-VGP';
    else if (srcStr === 'G') cls = 'split-G';
    else if (srcStr === 'P') cls = 'split-P';
    
    entriesHtml += `<tr>
      <td><div class="score-bar"><div class="score-fill ${cls}" style="width:${pct}%"></div></div></td>
      <td>${e.score.toFixed(4)}</td>
      <td>${e.sources.map(s => `<span class="source-tag tag-${s[0]}">${s}</span>`).join(' ')}</td>
      <td><span style="color:#93c5fd">${e.domain}</span></td>
      <td>${e.entities.map(ent => `<span class="entity-tag">${ent}</span>`).join('')}</td>
      <td><div class="text-preview">${e.text_preview}</div></td>
    </tr>`;
  }
  
  const meta = qData.meta;
  
  let llmHtml = '';
  if (llmData && llmData.answer) {
    llmHtml = `
      <h3>LLM 综合回答</h3>
      <div class="llm-box">
        <div class="llm-label">sensenova/sensenova-6.7-flash-lite</div>
        <div class="llm-text">${llmData.answer}</div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:#64748b">
        基于 ${llmData.evidence.length} 条检索证据综合回答
      </div>
    `;
  }
  
  return `
    <div class="query-card">
      <div class="query-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <div>
          <span class="q-title">#${idx} ${qText}</span>
        </div>
        <div class="q-meta">
          <span>⏱ ${qData.latency}s</span>
          <span><span class="q-badge-V">V=${meta.vector_results}</span></span>
          <span><span class="q-badge-G">G=${meta.graph_results}</span></span>
          <span><span class="q-badge-P">P=${meta.path_results}</span></span>
          <span>🎯 ${qData.entries.length} results</span>
        </div>
      </div>
      <div class="query-body open">
        <table class="result-table">
          <tr><th style="width:80px">Score</th><th style="width:60px">Value</th><th style="width:90px">Sources</th><th style="width:140px">Domain</th><th style="width:160px">Entities</th><th>Text Preview</th></tr>
          ${entriesHtml}
        </table>
        ${llmHtml}
      </div>
    </div>
  `;
}

function renderInsights(queries) {
  const insights = [];
  
  // Count how often each channel contributes to top-3
  let vTop3 = 0, gTop3 = 0, pTop3 = 0;
  for (const [q, d] of Object.entries(queries)) {
    for (let i = 0; i < Math.min(3, d.entries.length); i++) {
      const src = d.entries[i].sources;
      if (src.includes('vector')) vTop3++;
      if (src.includes('graph')) gTop3++;
      if (src.includes('path')) pTop3++;
    }
  }
  
  // Channel contribution analysis
  let vOnly = 0, gOnly = 0, pOnly = 0, vgp = 0, vg = 0, vp = 0, gp = 0;
  for (const [q, d] of Object.entries(queries)) {
    for (const e of d.entries) {
      const s = e.sources;
      if (s.length === 1) {
        if (s[0] === 'vector') vOnly++;
        else if (s[0] === 'graph') gOnly++;
        else if (s[0] === 'path') pOnly++;
      } else if (s.length === 2) {
        if (s.includes('vector') && s.includes('graph')) vg++;
        else if (s.includes('vector') && s.includes('path')) vp++;
        else if (s.includes('graph') && s.includes('path')) gp++;
      } else if (s.length === 3) vgp++;
    }
  }
  
  document.getElementById('insights-container').innerHTML = `
    <h3>📊 通道贡献分析</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
      <div class="insight-box">
        <b>Top-3 命中分布</b>（6 查询 × top-3 = 18 个位置）<br>
        <span class="q-badge-V">Vector</span>: ${vTop3}/18 (${(vTop3/18*100).toFixed(0)}%)<br>
        <span class="q-badge-G">Graph</span>: ${gTop3}/18 (${(gTop3/18*100).toFixed(0)}%)<br>
        <span class="q-badge-P">Path</span>: ${pTop3}/18 (${(pTop3/18*100).toFixed(0)}%)
      </div>
      <div class="insight-box highlight-green">
        <b>通道组合分布</b>（全部结果）<br>
        仅 Vector: ${vOnly} | 仅 Graph: ${gOnly} | 仅 Path: ${pOnly}<br>
        V+G: ${vg} | V+P: ${vp} | G+P: ${gp} | V+G+P: ${vgp}
      </div>
    </div>

    <h3>🔬 关键发现</h3>
    
    <div class="insight-box">
      <b>1. Path Search 提供精确实体匹配</b><br>
      Path 通道通过实体链 BFS 2-hop 遍历，找到与查询实体精确匹配的 chunk。
      例如 "XSS攻击" → 提取实体 "XSS" → 匹配到所有包含 "XSS" 的 chunk。
      这是精确搜索的关键通道，尤其在财务域中 "营业收入" 等实体匹配效果显著。
    </div>

    <div class="insight-box highlight-green">
      <b>2. Vector Search 提供语义广度</b><br>
      即使查询不包含精确实体名（如 "防御方法"），Vector 通道仍能通过语义相似度找到相关 chunk。
      2560 维 embedding 覆盖了同义、上下位等语义关系。
      每个查询都能召回 8 个 Vector 结果，覆盖语义空间。
    </div>

    <div class="insight-box highlight-purple">
      <b>3. Graph Expansion 跨文档桥接</b><br>
      Graph 通道基于实体共现关系做跨 chunk 扩散。例如 "Cookie劫持" 实体在 XSS 和 CSRF 两个文档中都出现，
      当查询 CSRF 时，Graph 扩展会召回包含 "Cookie劫持" 的 XSS chunk — 实现跨文档知识桥接。
    </div>

    <div class="insight-box">
      <b>4. RRF Fusion 天然排序融合</b><br>
      被两个以上通道同时召回的 chunk 获得显著更高的 RRF score（通常 0.032+ vs 单通道 0.016）。
      这等价于多通道交叉验证：同一个 chunk 被 Vector 和 Path 同时命中 ⇒ 高置信度 ⇒ 排在前面。
    </div>

    <h3>📈 测试结果概览</h3>
    <table class="result-table" style="margin-top:8px">
      <tr><th>Query</th><th>V</th><th>G</th><th>P</th><th>Top-1 Score</th><th>Top-1 Sources</th><th>Top-1 Domain</th></tr>
      ${Object.entries(queries).map(([q, d]) => {
        const t1 = d.entries[0] || {};
        return `<tr>
          <td style="font-weight:500">${q}</td>
          <td><span class="q-badge-V">${d.meta.vector_results}</span></td>
          <td><span class="q-badge-G">${d.meta.graph_results}</span></td>
          <td><span class="q-badge-P">${d.meta.path_results}</span></td>
          <td>${t1.score?.toFixed(4) || '-'}</td>
          <td>${(t1.sources||[]).map(s => `<span class="source-tag tag-${s[0]}">${s}</span>`).join(' ')}</td>
          <td>${t1.domain || '-'}</td>
        </tr>`;
      }).join('')}
    </table>
  `;
  
  // Update tags line (if element exists)
  const tagsEl = document.getElementById('tags-line');
  if (tagsEl) tagsEl.textContent = `V=${vTop3} G=${gTop3} P=${pTop3}`;
}

// ── Report structure ──────────────────────────────────────────────────
document.write(`
<div class="arch-section" id="arch-container"><h2>🏗️ 检索架构</h2></div>
<div class="arch-section" id="fusion-container"><h2>⚖️ RRF Fusion 原理</h2></div>
<h2>📋 查询详细分析</h2>
<div id="queries-container"></div>
<div class="arch-section" id="insights-container"><h2>💡 分析与洞察</h2></div>
`);
